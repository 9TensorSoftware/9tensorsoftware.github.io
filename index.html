<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9Tensor</title>
  <!-- A holding page until launch. The full site is in the commit before this one. -->
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07080B">

  <link rel="icon" href="/favicon.ico" sizes="32x32">

  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;

      background: #07080B;
      color: #F1F2F5;
      font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 24px 16px;

    h1 {
      margin: 0;

      font-weight: 600;
      letter-spacing: -0.01em;

    a {
      color: #A9AEBA;
      text-decoration: none;
    }
    a:hover {
      color: #F1F2F5;
    }
    a:focus-visible {
      outline: 2px solid #8C96FF;
      outline-offset: 3px;
      border-radius: 3px;
