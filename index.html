<body>
  <header class="wrap top">
    <a class="brand" href="./" aria-label="9Tensor, home">
      <!-- The mark: a 3 × 3 grid of dots (a tensor of nine) whose lit dots draw a 9. -->
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="7" cy="7" r="3.3"/><circle cx="16" cy="7" r="3.3"/><circle cx="25" cy="7" r="3.3"/>
        <circle cx="7" cy="16" r="3.3"/><circle cx="16" cy="16" r="3.3"/><circle cx="25" cy="16" r="3.3"/>
        <circle class="mark__off" cx="7" cy="25" r="3.3"/><circle class="mark__off" cx="16" cy="25" r="3.3"/><circle class="mark__accent" cx="25" cy="25" r="3.3"/>

    </a>
    <nav class="top__nav" aria-label="Sections">
      <a class="top__link" href="#software">Software</a>
      <a class="top__link" href="#data">Data</a>
      <a class="top__link" href="https://github.com/9tensorsoftware">GitHub</a>
    </nav>

  <main class="wrap">
    <section class="hero">
      <h1>Open-source software and&nbsp;data.</h1>
    </section>

    <!-- One section per kind of work. Each project is one <li>; see README.md. -->
    <section class="group" id="software" aria-labelledby="software-title">
      <h2 class="label" id="software-title">Software</h2>
      <ul class="list">
        <li class="project" style="--tint: #D4572A; --tint-dark: #F5753F">
          <h3 class="project__name"><a href="https://retouch.9tensor.com">R<em>é</em>touch</a></h3>
          <div class="project__body">
            <p class="project__desc">A photo and video editor for the browser, with on-device AI.</p>
            <p class="project__links">
              <a class="project__open" href="https://retouch.9tensor.com">Open<span aria-hidden="true"> ↗</span></a>
              <a href="https://github.com/9tensorsoftware/retouch">Source<span aria-hidden="true"> ↗</span></a>
            </p>
          </div>
        </li>
      </ul>
    </section>

    <section class="group" id="data" aria-labelledby="data-title">
      <h2 class="label" id="data-title">Data <span class="label__note">Coming soon</span></h2>
    </section>
